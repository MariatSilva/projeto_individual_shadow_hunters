<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AquaTech | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/login.css">
    <link rel="icon" href="/assets/img/logo.png">

</head>

<body>




    <div id="header"></div>

    <script>
        fetch("/includes/header.html")
            .then(resposta => resposta.text())
            .then(dados => {
                document.getElementById("header").innerHTML = dados
            });
    </script>


    <div class="container_geral">

        <div class="formulario">


            <p class="titulo_formulario">Bem-vindo de volta</p>
            <img src="/site/public/img/logo_branco.png" alt="">
            <div class="input_geral">

                <label for="">Email:</label>
                <input type="email" id="email_input">
                <label for="">Senha:</label>
                <input type="password" id="senha_input">

            </div>
            <a href="">Esqueci minha senha</a>
            <button onclick="entrar()">Entrar</button>
        
                <div class="card_erro" id="cardErro">
                    <span id="mensagem_erro"></span>
                </div>
            
            <div id="div_aguardar" class="loading-div">
                <img src="./assets/show-loader.gif" id="loading-gif">
            </div>

            <div id="div_erros_login"></div>
        </div>

    </div>
</body>

</html>

<script>


    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        if(json.id == 1){
                            window.location = "./dashboard/dash_quiz_geral.html";  
                        }else{
                             window.location = "./quizes/quiz.html";
                        }
                       
                    }, 2000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
